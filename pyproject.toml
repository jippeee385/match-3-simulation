[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "match3-difficulty-lab"
version = "0.1.0"
description = "Simulation and data science experiments for match-3 game difficulty and level balancing."
requires-python = ">=3.14"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]